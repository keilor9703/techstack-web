<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="200" height="200" rx="38" fill="#080D18"/>

  <!-- Dashed circle border with glow -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#1CE8FF" stroke-width="2.5"
    stroke-dasharray="9 7" opacity="0.85" filter="url(#glow)"/>

  <!-- k vertical stem -->
  <rect x="50" y="38" width="20" height="126" rx="3" fill="#1CE8FF" filter="url(#glow)"/>

  <!-- Upper arm of k (upper-right diagonal) -->
  <polygon points="70,62 70,80 148,38 126,38" fill="#1CE8FF" filter="url(#glow)"/>

  <!-- Lower arm of k (lower-right diagonal) -->
  <polygon points="70,116 70,134 148,164 126,164" fill="#1CE8FF" filter="url(#glow)"/>

  <!-- Lightning bolt — cuts through the k intersection (dark overlay creates the bolt shape) -->
  <!-- Dark cutout behind the bolt -->
  <polygon points="113,52 90,94 108,94 84,142 107,106 89,106 112,64"
    fill="#080D18"/>

  <!-- Bright lightning bolt lines on top -->
  <polyline points="112,55 91,92 108,92 86,138"
    fill="none" stroke="#1CE8FF" stroke-width="5" stroke-linejoin="round"
    stroke-linecap="round" filter="url(#softglow)" opacity="0.9"/>
</svg>
